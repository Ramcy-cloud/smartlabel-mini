services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # Origines autorisées (CORS), séparées par des virgules. Surchargeable via .env ou l'environnement.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5175,http://localhost:5173}
    volumes:
      # Permet au modèle IA d'être mis en cache localement pour ne pas être retéléchargé à chaque démarrage
      - huggingface_cache:/root/.cache/huggingface
      # Jeux de catégories enregistrés par l'équipe
      - label_sets_data:/app/data

  frontend:
    build: 
      context: ./frontend
    ports:
      # On mappe le port 5175 de ta machine vers le 5173 du conteneur
      - "5175:5173"
    depends_on:
      - backend

volumes:
  huggingface_cache:
  label_sets_data: